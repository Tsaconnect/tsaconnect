# Netlify site for app.tsaconnectworld.com. Set the site's base directory to
# tsa-web. All routing lives here (not in public/_redirects): Netlify evaluates
# _redirects first, where the catch-all would swallow /api, and only netlify.toml
# can sign a proxy. First match wins.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# A hashed asset that isn't there (an old tab after a deploy) must 404, never
# fall through to index.html — which /assets/* headers would mark immutable.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Browsers still probe for it; the icon is /favicon.png.
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 200

# The merchant API is served at https://tsa.mcgpchain.com/api/pay/v1 only (the
# documented base URL). It is not proxied here: a merchant who used this origin
# instead would get Netlify's http→https redirect, which the API host refuses
# for a key-bearing request (see tsa-api-go/deploy/README.md, Cloudflare).
[[redirects]]
  from = "/api/pay/v1/*"
  to = "/404.html"
  status = 404
  force = true

# The API, on this origin: the SameSite=Strict session cookies and the API's
# Origin check (WEB_APP_ORIGIN) both need the browser to see ONE origin.
# `signed` makes Netlify add x-nf-sign (HS256, secret = the site's
# API_SIGNATURE_TOKEN env var, scope Runtime). The API verifies it with
# NETLIFY_PROXY_SECRET — the same value — and only then counts the request as
# coming from the visitor in X-Nf-Client-Connection-Ip instead of from Netlify.
[[redirects]]
  from = "/api/*"
  to = "https://tsa.mcgpchain.com/api/:splat"
  status = 200
  force = true
  signed = "API_SIGNATURE_TOKEN"

# Client-side routes: every other path is the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
