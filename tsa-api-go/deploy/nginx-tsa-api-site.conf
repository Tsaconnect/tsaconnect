# The proxy stanza for tsa.mcgpchain.com. Merge into the existing server block —
# do NOT install this as a standalone file; TLS config lives with the existing site.
location /api/ {
    proxy_pass http://tsa_api;

    # REQUIRED, not optional. The API calls SetTrustedProxies({127.0.0.1, ::1}), which
    # only helps if nginx overwrites what the client sent. $proxy_add_x_forwarded_for
    # appends the real peer to any client-supplied value, and Gin takes the rightmost
    # untrusted hop — so a forged header can no longer choose the IP used by the rate
    # limiter and the audit logs.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # `keepalive` in the upstream is inert without both of these: HTTP/1.0 opens a
    # fresh TCP connection per request and can produce spurious 502s.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
